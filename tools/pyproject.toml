[project]
name = "gps-tracker-tools"
version = "0.1.0"
description = "CLI tools for gps_tracker: Apple Find My, CASIC protocol, GPS format, UF2 build"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.scripts]
gt = "gps_tracker_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gps_tracker_tools"]
