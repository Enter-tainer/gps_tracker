name: Build Firmware UF2

on:
  push:
    branches:
      - master
      - main
    paths:
      - "firmware/**"
      - "tools/ble_sim/**"
      - "tools/src/gps_tracker_tools/uf2.py"
      - "uf2conv.py"
      - ".github/workflows/build-firmware-uf2.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/ble_sim/**"
      - "tools/src/gps_tracker_tools/uf2.py"
      - "uf2conv.py"
      - ".github/workflows/build-firmware-uf2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uf2:
    # Pinned: nrf-mpsl-sys generates its bindings with bindgen at build time, and
    # the ubuntu-26.04 image's libclang resolves CMSIS's <stdint.h> to nothing
    # ("unknown type name 'uint32_t'"), which breaks the firmware build.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware -> firmware/target

      - name: Install cargo tools
        run: cargo install --locked flip-link cargo-binutils

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build app UF2
        run: cd tools && uv run gt uf2 build

      - name: Show artifacts
        run: |
          ls -lh firmware/target/thumbv7em-none-eabihf/release/gps-tracker.hex
          ls -lh firmware/target/thumbv7em-none-eabihf/release/gps-tracker.uf2
          sha256sum firmware/target/thumbv7em-none-eabihf/release/gps-tracker.uf2

      - name: Upload UF2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: |
            firmware/target/thumbv7em-none-eabihf/release/gps-tracker.hex
            firmware/target/thumbv7em-none-eabihf/release/gps-tracker.uf2
          if-no-files-found: error

  ble-sim-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/ble_sim -> tools/ble_sim/target

      - name: Host dual-advertising simulator tests
        run: cargo test --locked --manifest-path tools/ble_sim/Cargo.toml
